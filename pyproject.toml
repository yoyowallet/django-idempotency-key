[tool.poetry]
name = "django-idempotency-key"
version = "1.3.0"
description = "Django middleware for idempotency key support in view and viewset functions."
authors = ["YoyoDevs <dev@yoyowallet.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yoyowallet/django-idempotency-key"
packages = [
    {include = "idempotency_key"}
]

[tool.poetry.dependencies]
python = ">=3.9,<4"
Django = ">=3.2.25"
djangorestframework = ">=3"
django-redis = ">=5.4.0"
redis = ">=5.2.1"

# pinned dependant packages for security updates and fixes
certifi = ">=2023.7.22"
cryptography = ">=41.0.2"
requests = ">=2.31.0"

[tool.poetry.group.dev.dependencies]
bump2version = "*"
codecov = "*"
django-debug-toolbar = "*"
pre-commit = "^4.0.1"
pytest = "*"
pytest-cov = ">=4.1.0"
pytest-mock = "*"
pytest-django = "*"
tox = "^4.23.2"
twine = "*"
xenon = "*"
virtualenv = "^20.28.0"
ruff = "^0.8.2"

[tool.black]
line-length = 88

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
